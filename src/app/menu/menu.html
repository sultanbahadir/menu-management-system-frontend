<div class="container">

  <h2>🍽 Günlük Menü</h2>

  <!-- FİYAT -->
  <div class="price-box">
    <label>Fiyat:</label>
    <input type="number" [(ngModel)]="selectedMenu.price" />
    <span>TL</span>
  </div>

  <!-- MENU ITEM EKLEME -->
  <div class="items">

    <h3>Menü İçeriği</h3>

    <div class="item" *ngFor="let item of selectedMenu.items; let i = index">

      <!-- CATEGORY -->
      <select [(ngModel)]="item.category">
        <option [ngValue]="Category.SOUP">Çorba</option>
        <option [ngValue]="Category.MAIN_COURSE">Ana Yemek</option>
        <option [ngValue]="Category.DESSERT">Tatlı</option>
        <option [ngValue]="Category.DRINK">İçecek</option>
      </select>

      <!-- NAME -->
      <input type="text" [(ngModel)]="item.name" placeholder="Yemek adı" />

      <!-- DELETE -->
      <button (click)="removeItem(i)">🗑</button>

    </div>

    <button class="add-btn" (click)="addItem()">
      ➕ Item Ekle
    </button>

  </div>

  <!-- SAVE -->
  <div class="actions">
    <button class="save-btn" (click)="saveMenu()">
      💾 Kaydet / Güncelle
    </button>
  </div>

  <hr />

  <!-- MENU LİSTESİ -->
  <h3>📋 Tüm Menüler</h3>

  <div class="menu-card" *ngFor="let menu of menus">

    <p><b>Fiyat:</b> {{ menu.price }} TL</p>

    <div *ngFor="let item of menu.items">
      <b>{{ getCategoryName(item.category) }}:</b>
      {{ item.name }}
    </div>

    <button (click)="deleteMenu(menu.id)">
      ❌ Sil
    </button>

    <button (click)="selectedMenu = menu">
      ✏️ Düzenle
    </button>

  </div>

</div>
